
name: MEF Final Results Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mef-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: mef-state-${{ github.run_id }}
          restore-keys: |
            mef-state-

      - name: Check official page every 30 seconds
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for i in $(seq 1 10); do
            echo "=== Verification $i/10 ==="
            python monitor.py || echo "Verification failed; continuing."
            if [ "$i" -lt 10 ]; then
              sleep 30
            fi
          done

      - name: Save latest state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: mef-state-${{ github.run_id }}
