name: MEF Final Results Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mef-monitor-v2
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: mef-state-${{ github.run_id }}
          restore-keys: |
            mef-state-

      - name: Test Telegram notification (manual run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u - <<'PY'
          import os, requests, sys
          token = os.getenv("TELEGRAM_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")
          if not token or not chat_id:
              sys.exit("ERREUR : Secrets Telegram introuvables.")
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          res = requests.post(url, data={"chat_id": chat_id, "text": "✅ Test réussi : GitHub Actions communique bien avec votre Bot Telegram !"})
          if res.status_code == 200 and res.json().get("ok"):
              print("SUCCESS: Notification Telegram envoyee avec succes.")
          else:
              sys.exit(f"ECHEC Telegram: {res.text}")
          PY

      - name: Check official page every 30 seconds
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for i in $(seq 1 10); do
            echo "=== Verification $i/10 ==="
            python monitor.py || echo "Verification echouee, passage a la suivante."
            if [ "$i" -lt 10 ]; then
              sleep 30
            fi
          done

      - name: Save latest state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: mef-state-${{ github.run_id }}
